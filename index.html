<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>고양이 바구니 구조대</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page-shell">
    <section class="game-card" aria-label="고양이 바구니 구조대 게임">
      <div class="hud" aria-live="polite">
        <div class="hud-item">점수 <strong id="score">0</strong></div>
        <div class="hud-item">목숨 <strong id="lives">3</strong></div>
        <div class="hud-item">최고 <strong id="bestScore">0</strong></div>
      </div>

      <div id="gameArea" class="game-area">
        <div class="cloud cloud-one">☁️</div>
        <div class="cloud cloud-two">☁️</div>
        <div id="catLayer" class="cat-layer" aria-hidden="true"></div>
        <div id="player" class="player" aria-label="고양이를 받는 바구니">🧺</div>
        <div class="ground"></div>

        <div id="startScreen" class="overlay overlay-visible">
          <h1>고양이 바구니 구조대</h1>
          <p>하늘에서 떨어지는 고양이를 바구니로 받아 주세요!</p>
          <p class="small-guide">PC: ← → 또는 A/D · 모바일: 아래 버튼</p>
          <button id="startButton" class="primary-button" type="button">게임 시작</button>
        </div>

        <div id="countdown" class="countdown" aria-live="assertive"></div>

        <div id="gameOverScreen" class="overlay">
          <h2>게임 오버</h2>
          <p>최종 점수: <strong id="finalScore">0</strong></p>
          <p>최고 점수: <strong id="finalBestScore">0</strong></p>
          <button id="restartButton" class="primary-button" type="button">다시 시작</button>
        </div>
      </div>

      <div class="mobile-controls" aria-label="모바일 조작 버튼">
        <button id="leftButton" class="control-button" type="button" aria-label="왼쪽으로 이동">◀</button>
        <button id="rightButton" class="control-button" type="button" aria-label="오른쪽으로 이동">▶</button>
      </div>
    </section>
  </main>
  <script src="js/game.js"></script>
</body>
</html>
